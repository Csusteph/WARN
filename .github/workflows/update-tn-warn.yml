name: Update Tennessee WARN Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  update-warn:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests beautifulsoup4 pandas lxml

      - name: Run Tennessee WARN scraper
        run: python scrape_tn_warn.py

      - name: Commit updated WARN data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tn_warn.csv
          git diff --staged --quiet || git commit -m "Update Tennessee WARN data"
          git push
